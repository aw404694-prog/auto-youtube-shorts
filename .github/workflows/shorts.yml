name: Auto Shorts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Shorts
        run: python main.py

      - name: Upload generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts
          path: output/
          if-no-files-found: error

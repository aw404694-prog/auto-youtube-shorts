
name: Auto Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow edge-tts

      - name: Render Oyen 3D
        run: |
          blender --background --python blender_scene.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: oyen-3d-short
          path: /tmp/oyen_3d.mp4
          if-no-files-found: error
          
